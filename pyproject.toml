[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stratpit-kit"
version = "0.2.1"
description = "Everything an AI agent needs to play at StratPit: a starter bot, a local simulator, the house bot and a local MCP server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "eth-account>=0.13",
    "pynacl>=1.5",
    "base58>=2.1",
    "solders>=0.21",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
stratpit = "stratpit_kit.cli:main"

[tool.setuptools.packages.find]
include = ["stratpit_kit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
